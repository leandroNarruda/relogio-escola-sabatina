<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Relógio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f1a;
      overflow: hidden;
      padding:
        max(env(safe-area-inset-top), 5vmin)
        max(env(safe-area-inset-right), 5vmin)
        max(env(safe-area-inset-bottom), 5vmin)
        max(env(safe-area-inset-left), 5vmin);
    }

    .clock-face {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #2a2a3e, #0d0d1a);
      box-shadow:
        0 0 40px rgba(255, 255, 255, 0.15),
        inset 0 0 30px rgba(255, 255, 255, 0.5);
      position: relative;
      flex-shrink: 0;
      transform: scale(var(--scale, 1));
    }

.tick {
      position: absolute;
      width: 4px;
      height: 16px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 1);
      left: 50%;
      top: 0;
      transform-origin: 50% 130px;
      margin-left: -2px;
    }

    .tick-thin {
      width: 1.5px;
      height: 12px;
      margin-left: -0.75px;
    }

    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      border-radius: 4px;
    }

    .minute-hand {
      width: 5px;
      height: 112px;
      background-color: white;
      margin-left: -2.5px;
      border-radius: 4px 4px 2px 2px;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.6), 0 0 8px rgba(255,255,255,0.5);
      cursor: grab;
      z-index: 15;
    }

    .minute-hand.dragging { cursor: grabbing; }

    .second-hand {
      width: 2px;
      height: 106px;
      background: linear-gradient(to top, #ff6060, #ff4040);
      margin-left: -1px;
      border-radius: 2px;
      box-shadow: 0 0 6px rgba(255, 60, 60, 0.6);
      z-index: 30;
    }

    .second-hand::after {
      content: '';
      position: absolute;
      bottom: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 14px;
      background: #ff4040;
      border-radius: 2px;
    }

    .center-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      background: #fff;
      border-radius: 50%;
      z-index: 20;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.6), 0 0 8px rgba(255,255,255,0.5);
    }

    .segments {
      position: absolute;
      top: 0;
      left: 0;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      overflow: hidden;
      pointer-events: none;
    }

    .clock-border-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 260px;
      height: 260px;
      pointer-events: none;
      z-index: 10;
      overflow: visible;
    }

    .alert-panel {
      position: fixed;
      right: max(env(safe-area-inset-right), 5vmin);
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      max-width: 260px;
    }

    @media (orientation: portrait) {
      body {
        flex-direction: column;
        justify-content: space-around;
      }

      .alert-panel {
        position: static;
        transform: none;
        max-width: min(90vw, 400px);
        align-items: center;
      }

      .alert-msg {
        text-align: center;
      }
    }

    .alert-msg {
      display: none;
      color: #fff;
      font-family: sans-serif;
      font-size: 22px;
      font-weight: 600;
      line-height: 1.4;
      padding: 10px 14px;
      border-radius: 10px;
      border-left: 4px solid currentColor;
    }

    .alert-msg.visible { display: block; }

    .alert-msg.green,
    .alert-msg.yellow,
    .alert-msg.blue,
    .alert-msg.orange,
    .alert-msg.red    { color: #e8e6f0; background: rgba(232,230,240,0.10); }

    @keyframes urgente {
      0%   { background: rgba(220,20,60,0.12); box-shadow: none;                         transform: scale(1);    color: #dc143c; }
      40%  { background: rgba(220,20,60,0.85); box-shadow: 0 0 22px rgba(220,20,60,0.8); transform: scale(1.06); color: #fff;    }
      100% { background: rgba(220,20,60,0.12); box-shadow: none;                         transform: scale(1);    color: #dc143c; }
    }

    .alert-msg.urgente {
      animation: urgente 0.9s ease-in-out infinite;
      border-left-color: #dc143c;
    }

    .fx-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1000;
    }

    .confetti {
      position: absolute;
      top: -5vh;
      width: 10px;
      height: 14px;
      border-radius: 2px;
      will-change: transform, opacity;
      animation: confetti-fall linear forwards;
    }

    @keyframes confetti-fall {
      0%   { transform: translate3d(0, -10vh, 0) rotate(0deg);           opacity: 1; }
      100% { transform: translate3d(var(--dx), 115vh, 0) rotate(var(--rot)); opacity: 0.85; }
    }

    .stage-banner {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 1001;
      font-family: sans-serif;
      font-weight: 900;
      font-size: clamp(2rem, 7vmin, 4.5rem);
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #fff;
      text-shadow:
        0 0 20px currentColor,
        0 0 40px currentColor,
        0 4px 14px rgba(0,0,0,0.8);
      animation: stage-banner 2.4s ease-out forwards;
    }

    @keyframes stage-banner {
      0%   { opacity: 0; transform: scale(0.3)  translateY(10vh); filter: blur(20px); }
      18%  { opacity: 1; transform: scale(1.18) translateY(0);    filter: blur(0);    }
      55%  { opacity: 1; transform: scale(1)    translateY(0);    filter: blur(0);    }
      100% { opacity: 0; transform: scale(1.3)  translateY(-8vh); filter: blur(6px);  }
    }

    .flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      background: radial-gradient(circle at center, var(--flash-color, #fff) 0%, transparent 65%);
      animation: flash 0.9s ease-out forwards;
    }

    @keyframes flash {
      0%   { opacity: 0;    }
      20%  { opacity: 0.55; }
      100% { opacity: 0;    }
    }

    .drag-time-tooltip {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.8rem;
      font-weight: bold;
      font-family: sans-serif;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(100, 100, 255, 0.8);
      pointer-events: none;
      z-index: 20;
      background: rgba(0, 0, 0, 0.55);
      padding: 4px 12px;
      border-radius: 8px;
      letter-spacing: 2px;
    }

    .drag-time-tooltip.visible { display: block; }

    #start-overlay {
      position: fixed;
      inset: 0;
      background: #0f0f1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      z-index: 9999;
    }

    #start-overlay.hidden { display: none; }

    #start-overlay span {
      font-family: sans-serif;
      color: rgba(255, 255, 255, 0.5);
      font-size: 1rem;
      letter-spacing: 0.05em;
      text-align: center;
      padding: 0 1rem;
    }

    .overlay-actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      align-items: center;
    }

    #start-btn,
    #settings-btn,
    .settings-action {
      background: none;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50px;
      color: #ffffff;
      font-family: sans-serif;
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      padding: 0.75rem 2.5rem;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #settings-btn {
      font-size: 0.95rem;
      padding: 0.55rem 1.4rem;
      color: rgba(255, 255, 255, 0.82);
    }

    #start-btn:hover,
    #settings-btn:hover,
    .settings-action:hover {
      border-color: rgba(255, 255, 255, 0.7);
      box-shadow: 0 0 20px rgba(100, 100, 255, 0.3);
    }

    #settings-screen {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: none;
      overflow: auto;
      background: #0f0f1a;
      padding: max(env(safe-area-inset-top), 24px) max(env(safe-area-inset-right), 18px) max(env(safe-area-inset-bottom), 24px) max(env(safe-area-inset-left), 18px);
      font-family: sans-serif;
      color: #fff;
    }

    #settings-screen.visible {
      display: block;
    }

    .settings-panel {
      width: min(920px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 1rem;
    }

    .settings-header {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
    }

    .settings-header h1 {
      font-size: clamp(1.45rem, 5vw, 2.2rem);
      line-height: 1.1;
    }

    .settings-card {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 1rem;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 0.75rem;
    }

    .settings-field {
      display: grid;
      gap: 0.35rem;
      color: rgba(255, 255, 255, 0.72);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .settings-field input,
    .settings-field select {
      width: 100%;
      min-height: 42px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.28);
      color: #fff;
      padding: 0.55rem 0.65rem;
      font: inherit;
      text-transform: none;
      letter-spacing: 0;
    }

    .stage-list {
      display: grid;
      gap: 0.75rem;
      margin-top: 0.85rem;
    }

    .stage-row {
      display: grid;
      grid-template-columns: 1.3fr 96px 84px auto;
      gap: 0.55rem;
      align-items: end;
      padding: 0.75rem;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.09);
    }

    .stage-tools {
      display: flex;
      gap: 0.35rem;
      align-items: center;
      justify-content: flex-end;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
    }

    .icon-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .settings-footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.7rem;
      align-items: center;
    }

    .settings-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .settings-action {
      font-size: 0.9rem;
      padding: 0.55rem 1rem;
      letter-spacing: 0.04em;
    }

    .settings-action.primary {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.55);
    }

    .settings-summary {
      color: rgba(255, 255, 255, 0.68);
      font-size: 0.95rem;
    }

    @media (max-width: 720px) {
      .settings-header,
      .settings-footer {
        align-items: stretch;
        flex-direction: column;
      }

      .stage-row {
        grid-template-columns: 1fr 82px;
      }

      .stage-row .settings-field:nth-child(3),
      .stage-tools {
        grid-column: 1 / -1;
      }

      .stage-tools {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <div id="start-overlay">
    <div class="overlay-actions">
      <button id="start-btn">▶ Iniciar relógio</button>
      <button id="settings-btn" type="button">⚙ Configurações</button>
    </div>
    <span>Toque para começar a cronometrar a programação</span>
  </div>

  <section id="settings-screen" aria-hidden="true">
    <div class="settings-panel">
      <div class="settings-header">
        <h1>Configurações do relógio</h1>
        <button class="settings-action" id="close-settings" type="button">Voltar</button>
      </div>

      <div class="settings-card">
        <div class="settings-grid">
          <label class="settings-field">
            Horário inicial
            <input id="setting-start-time" type="time" />
          </label>
        </div>
      </div>

      <div class="settings-card">
        <strong>Programação</strong>
        <div class="stage-list" id="stage-list"></div>
      </div>

      <div class="settings-footer">
        <div class="settings-summary" id="settings-summary"></div>
        <div class="settings-actions">
          <button class="settings-action" id="add-stage" type="button">Adicionar etapa</button>
          <button class="settings-action" id="reset-settings" type="button">Restaurar padrão</button>
          <button class="settings-action primary" id="save-settings" type="button">Salvar</button>
        </div>
      </div>
    </div>
  </section>
  <div class="clock-face" id="clock">
    <div class="hand minute-hand" id="minute"></div>
    <div class="hand second-hand" id="second"></div>
    <div class="center-dot"></div>
    <div id="drag-time-tooltip" class="drag-time-tooltip"></div>
  </div>

  <div class="alert-panel" id="alertPanel">
    <div class="alert-msg" id="alertMsg"></div>
  </div>

  <script>
    const clockEl = document.getElementById('clock');

    function setScale() {
      const safe = parseFloat(getComputedStyle(document.body).paddingTop) * 2;
      const available = Math.min(window.innerWidth, window.innerHeight) - safe;
      const scale = available / 260;
      document.documentElement.style.setProperty('--scale', scale);
    }

    setScale();
    window.addEventListener('resize', setScale);

    function polarToXY(cx, cy, r, clockDeg) {
      const rad = (clockDeg - 90) * Math.PI / 180;
      return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
    }

    const donutInnerRadius = 30;

    function segmentPath(cx, cy, r, startDeg, endDeg) {
      const ri = donutInnerRadius;
      const s  = polarToXY(cx, cy, r,  startDeg);
      const e  = polarToXY(cx, cy, r,  endDeg);
      const si = polarToXY(cx, cy, ri, startDeg);
      const ei = polarToXY(cx, cy, ri, endDeg);
      const large = endDeg - startDeg > 180 ? 1 : 0;
      return [
        `M ${s.x.toFixed(3)} ${s.y.toFixed(3)}`,
        `A ${r} ${r} 0 ${large} 1 ${e.x.toFixed(3)} ${e.y.toFixed(3)}`,
        `L ${ei.x.toFixed(3)} ${ei.y.toFixed(3)}`,
        `A ${ri} ${ri} 0 ${large} 0 ${si.x.toFixed(3)} ${si.y.toFixed(3)}`,
        'Z'
      ].join(' ');
    }

    const svgNS = 'http://www.w3.org/2000/svg';
    const dias = ['Sábado', 'Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta'];
    const licaoDias = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta'];
    const licaoDiasKeys = ['sabado', 'domingo', 'segunda', 'terca', 'quarta', 'quinta', 'sexta'];
    const configStorageKey = 'relogio-escola-sabatina-config-v1';
    const defaultConfig = {
      startTime: '09:00',
      stages: [
        { label: 'Abertura', duration: 15, color: '#0c0636', kind: 'normal', audioKey: 'confraternizacao' },
        { label: 'Confraternização', duration: 5, color: '#095169', kind: 'normal', audioKey: 'licao' },
        { label: 'Lição', duration: 40, color: '#059b9a', kind: 'lesson', audioKey: 'fechamento' },
        { label: 'Fechamento', duration: 10, color: '#53ba83', kind: 'normal', audioKey: 'pastoreio' },
        { label: 'Pastoreio', duration: 5, color: '#9fd86b', kind: 'normal', audioKey: null },
      ],
    };

    const stageAudioMap = {
      confraternizacao: 'confraternizacao',
      licao:            'licao',
      fechamento:       'fechamento',
      pastoreio:        'pastoreio',
    };

    let config = loadConfig();
    let timeline = [];
    let totalSessionMinutes = 75;
    let svg = null;
    let shadowPath = null;
    let borderSvg = null;
    let settingsDraft = cloneConfig(config);

    function cloneConfig(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function normalizeConfig(value) {
      const source = value && Array.isArray(value.stages) ? value : defaultConfig;
      const stages = source.stages
        .map((stage, index) => ({
          label: String(stage.label || `Etapa ${index + 1}`).trim() || `Etapa ${index + 1}`,
          duration: Math.max(1, Number(stage.duration) || 1),
          color: /^#[0-9a-f]{6}$/i.test(stage.color || '') ? stage.color : defaultConfig.stages[index % defaultConfig.stages.length].color,
          kind: inferStageKind(stage, index),
          audioKey: inferStageAudio(stage, index),
        }))
        .filter(stage => stage.duration > 0);

      return {
        startTime: /^\d{2}:\d{2}$/.test(source.startTime || '') ? source.startTime : defaultConfig.startTime,
        stages: stages.length ? stages : cloneConfig(defaultConfig.stages),
      };
    }

    function inferStageKind(stage, index) {
      if (stage.kind === 'lesson') return 'lesson';
      if (String(stage.label || '').trim().toLowerCase() === 'lição') return 'lesson';
      return defaultConfig.stages[index]?.kind === 'lesson' ? 'lesson' : 'normal';
    }

    function inferStageAudio(stage, index) {
      if (stage.audioKey && stageAudioMap[stage.audioKey]) return stage.audioKey;
      return defaultConfig.stages[index]?.audioKey || null;
    }

    function loadConfig() {
      try {
        const stored = localStorage.getItem(configStorageKey);
        return normalizeConfig(stored ? JSON.parse(stored) : defaultConfig);
      } catch {
        return cloneConfig(defaultConfig);
      }
    }

    function saveConfig(nextConfig) {
      config = normalizeConfig(nextConfig);
      localStorage.setItem(configStorageKey, JSON.stringify(config));
      renderClockFace();
      lastStageKey = null;
      lastStageIndex = null;
      umMinutoPlayed = createMinuteFlags();
    }

    function minutesToDeg(minutes) {
      return (minutes / totalSessionMinutes) * 360;
    }

    function stageKey(stage, index) {
      return `${stage.kind === 'lesson' ? 'licao' : 'stage'}-${index}`;
    }

    function nextStageName(index) {
      return config.stages[index + 1]?.label.toLowerCase() || 'o fim';
    }

    function buildTimeline() {
      let cursor = 0;
      totalSessionMinutes = config.stages.reduce((sum, stage) => sum + stage.duration, 0);
      timeline = config.stages.map((stage, index) => {
        const start = cursor;
        const end = cursor + stage.duration;
        cursor = end;
        return {
          ...stage,
          index,
          key: stageKey(stage, index),
          start,
          end,
          startDeg: minutesToDeg(start),
          endDeg: minutesToDeg(end),
        };
      });
    }

    function textColorForLabel(stage) {
      return stage.duration < totalSessionMinutes * 0.08 ? '9' : '10';
    }

    function renderClockFace() {
      buildTimeline();

      clockEl.querySelectorAll('.segments, .tick, .clock-border-overlay').forEach(el => el.remove());

      svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('viewBox', '0 0 260 260');
      svg.classList.add('segments');

      timeline.forEach(stage => {
        const path = document.createElementNS(svgNS, 'path');
        path.setAttribute('d', segmentPath(130, 130, 126, stage.startDeg, stage.endDeg));
        path.setAttribute('fill', stage.color);
        path.setAttribute('fill-opacity', '0.85');
        path.setAttribute('stroke', 'none');
        svg.appendChild(path);
      });

      timeline.forEach(stage => {
        const midDeg = (stage.startDeg + stage.endDeg) / 2;
        const r = 80;
        const { x, y } = polarToXY(130, 130, r, midDeg);
        const rot = (midDeg > 90 && midDeg < 270) ? midDeg + 90 : midDeg - 90;

        const g = document.createElementNS(svgNS, 'g');
        g.setAttribute('transform', `translate(${x.toFixed(3)} ${y.toFixed(3)}) rotate(${rot})`);

        const textEl = document.createElementNS(svgNS, 'text');
        textEl.setAttribute('text-anchor', 'middle');
        textEl.setAttribute('dominant-baseline', 'central');
        textEl.setAttribute('fill', '#fff');
        textEl.setAttribute('font-size', textColorForLabel(stage));
        textEl.setAttribute('font-family', 'sans-serif');
        textEl.setAttribute('font-weight', '600');
        textEl.textContent = stage.label;

        g.appendChild(textEl);
        svg.appendChild(g);
      });

      const defs = document.createElementNS(svgNS, 'defs');
      svg.appendChild(defs);

      timeline
        .filter(stage => stage.kind === 'lesson')
        .forEach(stage => {
          const arcR = 113;

          dias.forEach((dia, i) => {
            const s = stage.startDeg + ((stage.endDeg - stage.startDeg) * i) / 7;
            const e = stage.startDeg + ((stage.endDeg - stage.startDeg) * (i + 1)) / 7;
            const p1 = polarToXY(130, 130, arcR, s);
            const p2 = polarToXY(130, 130, arcR, e);

            const arcPath = document.createElementNS(svgNS, 'path');
            const pathId = `dia-arc-${stage.index}-${i}`;
            arcPath.setAttribute('id', pathId);
            arcPath.setAttribute('d',
              `M ${p1.x.toFixed(3)} ${p1.y.toFixed(3)} ` +
              `A ${arcR} ${arcR} 0 0 1 ${p2.x.toFixed(3)} ${p2.y.toFixed(3)}`
            );
            arcPath.setAttribute('fill', 'none');
            defs.appendChild(arcPath);

            const textEl = document.createElementNS(svgNS, 'text');
            textEl.setAttribute('font-size', '8');
            textEl.setAttribute('font-family', 'sans-serif');
            textEl.setAttribute('font-weight', '600');
            textEl.setAttribute('fill', '#fff');
            textEl.setAttribute('fill-opacity', '0.9');

            const textPath = document.createElementNS(svgNS, 'textPath');
            textPath.setAttribute('href', `#${pathId}`);
            textPath.setAttribute('startOffset', '50%');
            textPath.setAttribute('text-anchor', 'middle');
            textPath.setAttribute('dominant-baseline', 'middle');
            textPath.textContent = dia;

            textEl.appendChild(textPath);
            svg.appendChild(textEl);
          });
        });

      shadowPath = document.createElementNS(svgNS, 'path');
      shadowPath.setAttribute('fill', 'rgba(0, 0, 0, 0.78)');
      shadowPath.setAttribute('stroke', 'none');
      svg.appendChild(shadowPath);

      clockEl.insertBefore(svg, clockEl.firstChild);

      timeline.forEach(stage => {
        const tick = document.createElement('div');
        tick.classList.add('tick');
        tick.style.transform = `rotate(${stage.startDeg}deg)`;
        clockEl.appendChild(tick);

        if (stage.kind === 'lesson') {
          Array.from({ length: 6 }, (_, i) => stage.startDeg + ((stage.endDeg - stage.startDeg) * (i + 1)) / 7)
            .forEach(deg => {
              const thinTick = document.createElement('div');
              thinTick.classList.add('tick', 'tick-thin');
              thinTick.style.transform = `rotate(${deg}deg)`;
              clockEl.appendChild(thinTick);
            });
        }
      });

      borderSvg = document.createElementNS(svgNS, 'svg');
      borderSvg.setAttribute('viewBox', '0 0 260 260');
      borderSvg.classList.add('clock-border-overlay');
      const borderCircle = document.createElementNS(svgNS, 'circle');
      borderCircle.setAttribute('cx', '130');
      borderCircle.setAttribute('cy', '130');
      borderCircle.setAttribute('r', '128');
      borderCircle.setAttribute('fill', 'none');
      borderCircle.setAttribute('stroke', 'white');
      borderCircle.setAttribute('stroke-width', '6');
      borderSvg.appendChild(borderCircle);
      clockEl.appendChild(borderSvg);
    }

    renderClockFace();

    const minuteHand = document.getElementById('minute');
    const secondHand = document.getElementById('second');
    const alertMsg = document.getElementById('alertMsg');
    const dragTooltip = document.getElementById('drag-time-tooltip');

    function degToTimeStr(deg) {
      const totalMinutes = deg / 360 * totalSessionMinutes;
      const [startHour, startMinute] = config.startTime.split(':').map(Number);
      const total = Math.floor(startHour * 60 + startMinute + totalMinutes);
      const h = Math.floor(total / 60);
      const m = total % 60;
      return `${h}h${String(m).padStart(2, '0')}`;
    }

    const audios = {
      hora: {
        confraternizacao: new Audio('audio/hora_confraternizacao.mp3'),
        licao:            new Audio('audio/hora_licao.mp3'),
        fechamento:       new Audio('audio/hora_fechamento.mp3'),
        pastoreio:        new Audio('audio/hora_pastoreio.mp3'),
      },
      umMinuto: {
        confraternizacao: new Audio('audio/um_minuto_confraternizacao.mp3'),
        licao:            new Audio('audio/um_minuto_licao.mp3'),
        fechamento:       new Audio('audio/um_minuto_fechamento.mp3'),
        pastoreio:        new Audio('audio/um_minuto_pastoreio.mp3'),
      },
    };

    let umMinutoPlayed = createMinuteFlags();

    function playAudio(audio) {
      if (!audio) return;
      audio.currentTime = 0;
      audio.play().catch(() => {});
    }

    function createMinuteFlags() {
      return { confraternizacao: false, licao: false, fechamento: false, pastoreio: false };
    }

    function stagePalette(color) {
      return [color, '#ffffff', '#b0adc8', '#ffffff'];
    }

    function currentStage(m) {
      if (m >= totalSessionMinutes) {
        return {
          key: 'fim',
          label: 'Fim',
          color: '#dc143c',
          palette: ['#dc143c', '#ff5673', '#9b0e2a', '#ffffff'],
        };
      }

      const stage = timeline.find(item => m < item.end) || timeline[timeline.length - 1];
      if (stage.kind === 'lesson') {
        const slice = stage.duration / 7;
        const idx = Math.min(6, Math.floor((m - stage.start) / slice));
        return {
          ...stage,
          key: `${stage.key}-${licaoDiasKeys[idx]}`,
          label: `${stage.label} · ${dias[idx]}`,
          color: '#e8e6f0',
          palette: stagePalette(stage.color),
          lessonDayIndex: idx,
        };
      }

      return {
        ...stage,
        color: '#e8e6f0',
        palette: stagePalette(stage.color),
      };
    }

    function fireStageAnimation(info) {
      if (!info) return;

      const flash = document.createElement('div');
      flash.className = 'flash';
      flash.style.setProperty('--flash-color', info.color);
      document.body.appendChild(flash);
      setTimeout(() => flash.remove(), 900);

      const banner = document.createElement('div');
      banner.className = 'stage-banner';
      banner.style.color = info.color;
      banner.textContent = info.label;
      document.body.appendChild(banner);
      setTimeout(() => banner.remove(), 2400);

      const layer = document.createElement('div');
      layer.className = 'fx-layer';
      document.body.appendChild(layer);

      const N = 90;
      for (let i = 0; i < N; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti';
        piece.style.left = (Math.random() * 100) + 'vw';
        piece.style.background = info.palette[i % info.palette.length];
        piece.style.setProperty('--dx', ((Math.random() - 0.5) * 60) + 'vw');
        piece.style.setProperty('--rot', (Math.random() * 1440 - 720) + 'deg');
        piece.style.animationDuration = (2.2 + Math.random() * 1.8) + 's';
        piece.style.animationDelay = (Math.random() * 0.4) + 's';
        piece.style.width = (6 + Math.random() * 8) + 'px';
        piece.style.height = (10 + Math.random() * 10) + 'px';
        piece.style.opacity = 0.85 + Math.random() * 0.15;
        layer.appendChild(piece);
      }
      setTimeout(() => layer.remove(), 4500);
    }

    let lastStageKey = null;
    let lastStageIndex = null;

    let sessionStarted = false;
    let startTime = Date.now();
    let dragging = false;
    let dragDeg = 0;

    document.getElementById('start-btn').addEventListener('click', () => {
      document.getElementById('start-overlay').classList.add('hidden');
      startTime = Date.now();
      lastStageKey = null;
      lastStageIndex = null;
      umMinutoPlayed = createMinuteFlags();
      sessionStarted = true;
    });

    const settingsScreen = document.getElementById('settings-screen');
    const stageList = document.getElementById('stage-list');
    const startTimeInput = document.getElementById('setting-start-time');
    const settingsSummary = document.getElementById('settings-summary');

    function formatDuration(minutes) {
      const hours = Math.floor(minutes / 60);
      const mins = minutes % 60;
      if (!hours) return `${mins} min`;
      if (!mins) return `${hours}h`;
      return `${hours}h ${mins}min`;
    }

    function escapeAttr(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function renderSettings() {
      settingsDraft = normalizeConfig(settingsDraft);
      startTimeInput.value = settingsDraft.startTime;
      const total = settingsDraft.stages.reduce((sum, stage) => sum + Number(stage.duration), 0);
      settingsSummary.textContent = `Duração total: ${formatDuration(total)} · ${settingsDraft.stages.length} etapas`;

      stageList.innerHTML = settingsDraft.stages.map((stage, index) => `
        <div class="stage-row" data-index="${index}">
          <label class="settings-field">
            Nome
            <input data-field="label" type="text" value="${escapeAttr(stage.label)}" />
          </label>
          <label class="settings-field">
            Minutos
            <input data-field="duration" type="number" min="1" step="1" value="${stage.duration}" />
          </label>
          <label class="settings-field">
            Cor
            <input data-field="color" type="color" value="${stage.color}" />
          </label>
          <div class="stage-tools">
            <button class="icon-btn" data-action="up" type="button" title="Subir" ${index === 0 ? 'disabled' : ''}>↑</button>
            <button class="icon-btn" data-action="down" type="button" title="Descer" ${index === settingsDraft.stages.length - 1 ? 'disabled' : ''}>↓</button>
            <button class="icon-btn" data-action="remove" type="button" title="Remover" ${settingsDraft.stages.length === 1 ? 'disabled' : ''}>×</button>
          </div>
        </div>
      `).join('');
    }

    function openSettings() {
      settingsDraft = cloneConfig(config);
      renderSettings();
      settingsScreen.classList.add('visible');
      settingsScreen.setAttribute('aria-hidden', 'false');
    }

    function closeSettings() {
      settingsScreen.classList.remove('visible');
      settingsScreen.setAttribute('aria-hidden', 'true');
    }

    function swapStages(from, to) {
      const next = settingsDraft.stages[to];
      settingsDraft.stages[to] = settingsDraft.stages[from];
      settingsDraft.stages[from] = next;
    }

    document.getElementById('settings-btn').addEventListener('click', openSettings);
    document.getElementById('close-settings').addEventListener('click', closeSettings);

    startTimeInput.addEventListener('input', () => {
      settingsDraft.startTime = startTimeInput.value || defaultConfig.startTime;
    });

    function updateStageDraftFromField(e) {
      const row = e.target.closest('.stage-row');
      if (!row) return;
      const stage = settingsDraft.stages[Number(row.dataset.index)];
      const field = e.target.dataset.field;
      if (!stage || !field) return;
      stage[field] = field === 'duration' ? Math.max(1, Number(e.target.value) || 1) : e.target.value;
      settingsDraft = normalizeConfig(settingsDraft);
      settingsSummary.textContent = `Duração total: ${formatDuration(settingsDraft.stages.reduce((sum, item) => sum + Number(item.duration), 0))} · ${settingsDraft.stages.length} etapas`;
    }

    stageList.addEventListener('input', updateStageDraftFromField);
    stageList.addEventListener('change', updateStageDraftFromField);

    stageList.addEventListener('click', e => {
      const button = e.target.closest('button[data-action]');
      const row = e.target.closest('.stage-row');
      if (!button || !row) return;

      const index = Number(row.dataset.index);
      if (button.dataset.action === 'up' && index > 0) {
        swapStages(index, index - 1);
      }
      if (button.dataset.action === 'down' && index < settingsDraft.stages.length - 1) {
        swapStages(index, index + 1);
      }
      if (button.dataset.action === 'remove' && settingsDraft.stages.length > 1) {
        settingsDraft.stages.splice(index, 1);
      }
      renderSettings();
    });

    document.getElementById('add-stage').addEventListener('click', () => {
      settingsDraft.stages.push({
        label: `Etapa ${settingsDraft.stages.length + 1}`,
        duration: 5,
        color: defaultConfig.stages[settingsDraft.stages.length % defaultConfig.stages.length].color,
        kind: 'normal',
        audioKey: null,
      });
      renderSettings();
    });

    document.getElementById('reset-settings').addEventListener('click', () => {
      settingsDraft = cloneConfig(defaultConfig);
      renderSettings();
    });

    document.getElementById('save-settings').addEventListener('click', () => {
      saveConfig(settingsDraft);
      closeSettings();
    });

    function clockCenter() {
      const r = clockEl.getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    }

    function pointerAngle(clientX, clientY) {
      const c = clockCenter();
      const deg = Math.atan2(clientX - c.x, -(clientY - c.y)) * 180 / Math.PI;
      return (deg + 360) % 360;
    }

    function update() {
      if (!sessionStarted) return;
      const elapsed = (Date.now() - startTime) / 1000;
      const minuteDeg = dragging ? dragDeg : (elapsed / (totalSessionMinutes * 60)) * 360;

      secondHand.style.transform = `rotate(${(elapsed % 60) * 6}deg)`;
      minuteHand.style.transform = `rotate(${minuteDeg}deg)`;

      const capped = Math.min(minuteDeg, 359.99);
      if (capped > 0.05) {
        shadowPath.setAttribute('d', segmentPath(130, 130, 126, 0, capped));
      } else {
        shadowPath.setAttribute('d', '');
      }

      const minutesElapsed = dragging ? (dragDeg / 360 * totalSessionMinutes) : (elapsed / 60);

      const stage = currentStage(minutesElapsed);
      const stageKey = stage.key;
      if (lastStageKey === null) {
        lastStageKey = stageKey;
        lastStageIndex = stage.index;
      } else if (stageKey !== lastStageKey) {
        if (!dragging) {
          fireStageAnimation(stage);
          const audioKey = stage.index !== lastStageIndex ? timeline[lastStageIndex]?.audioKey : null;
          if (audioKey) playAudio(audios.hora[audioKey]);
          if (stageKey === 'fim') {
            setTimeout(() => {
              sessionStarted = false;
              lastStageKey = null;
              lastStageIndex = null;
              umMinutoPlayed = createMinuteFlags();
              alertMsg.className = 'alert-msg';
              document.getElementById('start-overlay').classList.remove('hidden');
            }, 4500);
          }
        }
        lastStageKey = stageKey;
        lastStageIndex = stage.index;
      }

      if (stage.key === 'fim') {
        alertMsg.className = 'alert-msg';
        return;
      }

      if (stage.kind === 'lesson') {
        const slice = stage.duration / 7;
        const dayEnd = stage.start + (stage.lessonDayIndex + 1) * slice;
        const remaining = Math.ceil(dayEnd - minutesElapsed);
        const label = remaining === 1 ? 'minuto' : 'minutos';
        const isLastDay = stage.lessonDayIndex === 6;
        alertMsg.textContent = isLastDay
          ? `faltam ${remaining} ${label} para ${nextStageName(stage.index)}`
          : `faltam ${remaining} ${label} para a parte de ${licaoDias[stage.lessonDayIndex]}`;
        alertMsg.className = `alert-msg blue visible${remaining <= 1 ? ' urgente' : ''}`;

        const minutesToLessonEnd = stage.end - minutesElapsed;
        if (stage.audioKey && minutesToLessonEnd <= 1 && minutesToLessonEnd > 0 && !umMinutoPlayed[stage.audioKey]) {
          umMinutoPlayed[stage.audioKey] = true;
          if (!dragging) playAudio(audios.umMinuto[stage.audioKey]);
        }
        if (stage.audioKey && minutesToLessonEnd > 1) umMinutoPlayed[stage.audioKey] = false;
      } else {
        const remaining = Math.ceil(stage.end - minutesElapsed);
        const minutesRemaining = stage.end - minutesElapsed;
        const label = remaining === 1 ? 'minuto' : 'minutos';
        alertMsg.textContent = `faltam ${remaining} ${label} para ${nextStageName(stage.index)}`;
        alertMsg.className = `alert-msg visible${remaining <= 1 ? ' urgente' : ''}`;

        if (stage.audioKey) {
          if (minutesRemaining <= 1 && minutesRemaining > 0 && !umMinutoPlayed[stage.audioKey]) {
            umMinutoPlayed[stage.audioKey] = true;
            if (!dragging) playAudio(audios.umMinuto[stage.audioKey]);
          }
          if (minutesRemaining > 1) umMinutoPlayed[stage.audioKey] = false;
        }
      }
    }

    minuteHand.addEventListener('mousedown', e => {
      dragging = true;
      dragDeg = pointerAngle(e.clientX, e.clientY);
      minuteHand.classList.add('dragging');
      dragTooltip.textContent = degToTimeStr(dragDeg);
      dragTooltip.classList.add('visible');
      e.preventDefault();
    });

    minuteHand.addEventListener('touchstart', e => {
      dragging = true;
      dragDeg = pointerAngle(e.touches[0].clientX, e.touches[0].clientY);
      minuteHand.classList.add('dragging');
      dragTooltip.textContent = degToTimeStr(dragDeg);
      dragTooltip.classList.add('visible');
      e.preventDefault();
    }, { passive: false });

    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      dragDeg = pointerAngle(e.clientX, e.clientY);
      dragTooltip.textContent = degToTimeStr(dragDeg);
    });

    window.addEventListener('touchmove', e => {
      if (!dragging) return;
      dragDeg = pointerAngle(e.touches[0].clientX, e.touches[0].clientY);
      dragTooltip.textContent = degToTimeStr(dragDeg);
    }, { passive: true });

    window.addEventListener('mouseup', () => {
      if (!dragging) return;
      startTime = Date.now() - (dragDeg / 360 * totalSessionMinutes * 60) * 1000;
      dragging = false;
      minuteHand.classList.remove('dragging');
      dragTooltip.classList.remove('visible');
    });

    window.addEventListener('touchend', e => {
      if (!dragging) return;
      dragDeg = pointerAngle(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
      startTime = Date.now() - (dragDeg / 360 * totalSessionMinutes * 60) * 1000;
      dragging = false;
      minuteHand.classList.remove('dragging');
      dragTooltip.classList.remove('visible');
    });

    update();
    setInterval(update, 50);
  </script>
</body>
</html>
